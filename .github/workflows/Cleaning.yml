name: Cleaning

on:
  schedule:
    - cron: 1 1 * * 1
  workflow_dispatch:

jobs:
  Cleanup-Workflow-Logs:
    runs-on: ubuntu-24.04
    steps:
      - name: Cleanup Workflow Logs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
        continue-on-error: true
